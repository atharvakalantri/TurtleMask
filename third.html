<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurtleMask — Secure Input Workspace</title>

  <!-- Typography: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (allows running JSX directly in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --color-green-deep: #0D3424;
      --color-green-primary: #123D2B;
      --color-green-dark: #082217;
      --color-green-subtle: #1C4D38;
      --color-yellow-primary: #F6C445;
      --color-yellow-hover: #E5B438;
      --color-yellow-light: #FFF8E6;
      --color-neutral-bg: #F8FAF9;
      --color-neutral-card: #FFFFFF;
      --color-neutral-border: #D1D9D5;
      --color-text-main: #1A2420;
      --color-text-muted: #52635B;
      --color-error-bg: #FDF2F2;
      --color-error-border: #F8B4B4;
      --color-error-text: #9B1C1C;
    }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--color-neutral-bg);
      color: var(--color-text-main);
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 0.3; }
      100% { opacity: 0.6; }
    }
    *:focus-visible {
      outline: 2px solid var(--color-yellow-primary) !important;
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    /* ==========================================================================
       MOCK SECURITY DETECTION DATASET
       ========================================================================== */
    const MOCK_SCAN_RESULTS = [
      {
        id: 'det-1',
        type: 'API Key',
        maskedValue: 'sk-proj-••••••••••••••••',
        confidence: '99.8%',
        action: 'Blocked',
        reason: 'Direct account access risk / Credential exposure',
        isSecret: true,
        userChoice: 'Block'
      },
      {
        id: 'det-2',
        type: 'Email Address',
        maskedValue: '<EMAIL_1>',
        confidence: '98.5%',
        action: 'Tokenized',
        reason: 'Personal Identifiable Information (PII)',
        isSecret: false,
        userChoice: 'Tokenize'
      },
      {
        id: 'det-3',
        type: 'Phone Number',
        maskedValue: '<PHONE_1>',
        confidence: '97.2%',
        action: 'Tokenized',
        reason: 'Personal Identifiable Information (PII)',
        isSecret: false,
        userChoice: 'Tokenize'
      },
      {
        id: 'det-4',
        type: 'Customer ID',
        maskedValue: '<CUSTOMER_ID_1>',
        confidence: '89.4%',
        action: 'Needs review',
        reason: 'Potential confidential business identifier',
        isSecret: false,
        userChoice: 'Tokenize'
      },
      {
        id: 'det-5',
        type: 'Standard Date',
        maskedValue: 'October 24, 2026',
        confidence: '99.9%',
        action: 'Allowed',
        reason: 'Low-risk contextual value',
        isSecret: false,
        userChoice: 'Allow'
      }
    ];

    /* ==========================================================================
       MAIN WORKSPACE COMPONENT
       ========================================================================== */
    function SecureInputWorkspace() {
      // Model State (Simulating Gemini selected from Dashboard)
      const [selectedModel, setSelectedModel] = useState({
        name: 'Gemini',
        version: '1.5 Pro',
        provider: 'Google',
        logoBg: '#1A73E8',
        securityLevel: 'Standard',
        approvedDataLevels: ['Public', 'Internal'],
        maxFileSize: '50 MB'
      });

      // User Sensitivity Selection & Input Tabs
      const [dataSensitivity, setDataSensitivity] = useState('Internal');
      const [activeTab, setActiveTab] = useState('text'); // text | voice | image | document

      // Input Contents
      const [rawText, setRawText] = useState('Hello team, please review API key sk-proj-9892348293489 and contact support@company.com or call +1-555-0199 regarding Customer ID CUST-9921 before October 24, 2026.');
      
      // Voice States
      const [isRecording, setIsRecording] = useState(false);
      const [recordingTime, setRecordingTime] = useState(0);

      // Image & Document States
      const [uploadedFile, setUploadedFile] = useState(null);
      const [isExtracting, setIsExtracting] = useState(false);

      // Scanning & Workflow States
      const [scanStatus, setScanStatus] = useState('idle'); // idle | scanning | completed
      const [scanLogs, setScanLogs] = useState([]);
      const [detectionResults, setDetectionResults] = useState([]);
      const [approvedSafeVersion, setApprovedSafeVersion] = useState(false);

      // AI Response States
      const [responseStatus, setResponseStatus] = useState('idle'); // idle | sending | scanning_output | ready
      const [aiResponseText, setAiResponseText] = useState('');
      const [outputScanned, setOutputScanned] = useState(false);

      // Timer ref for voice recording simulation
      const timerRef = useRef(null);

      // Voice Recording Simulation
      const handleStartRecording = () => {
        setIsRecording(true);
        setRecordingTime(0);
        timerRef.current = setInterval(() => {
          setRecordingTime(prev => prev + 1);
        }, 1000);
      };

      const handleStopRecording = () => {
        clearInterval(timerRef.current);
        setIsRecording(false);
      };

      const handleSpeechToText = () => {
        setRawText("Audio transcript: Analyzing database credentials connection string postgres://admin:secretpass@localhost:5432/db for user john.doe@enterprise.org.");
        setActiveTab('text');
      };

      // File Upload & OCR / Document Text Extraction
      const handleFileUpload = (e, type) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadedFile(file);
      };

      const handleExtractText = () => {
        setIsExtracting(true);
        setTimeout(() => {
          setIsExtracting(false);
          setRawText(`Extracted text from ${uploadedFile?.name || 'document'}: API Access Token bearer_token_991823 for client support@clientportal.com.`);
          setActiveTab('text');
        }, 1200);
      };

      // Security Scanning Pipeline
      const handleSecurityScan = () => {
        if (!rawText.trim()) return;
        setScanStatus('scanning');
        setScanLogs([
          'Scanning for sensitive information...',
          'Checking for credentials and secrets...',
          'Checking for personal data...',
          'Checking for confidential business data...',
          'Preparing safe version of your request...'
        ]);

        /* BACKEND INTEGRATION PLACEHOLDER:
           POST /api/v1/gateway/scan-input { rawText, sensitivity: dataSensitivity }
        */
        setTimeout(() => {
          setScanStatus('completed');
          setDetectionResults(MOCK_SCAN_RESULTS);
        }, 1800);
      };

      // Validation check for Send Secure Request
      const isReadyToSend = useMemo(() => {
        const isCompliant = selectedModel.approvedDataLevels.includes(dataSensitivity);
        return rawText.trim().length > 0 && scanStatus === 'completed' && approvedSafeVersion && isCompliant;
      }, [rawText, scanStatus, approvedSafeVersion, selectedModel, dataSensitivity]);

      // Send Secure Request Workflow
      const handleSendSecureRequest = () => {
        if (!isReadyToSend) return;
        setResponseStatus('sending');

        /* BACKEND INTEGRATION PLACEHOLDER:
           1. POST /api/v1/gateway/proxy/forward
           2. Execute Output Scanner Filter
        */
        setTimeout(() => {
          setResponseStatus('scanning_output');
          setTimeout(() => {
            setResponseStatus('ready');
            setOutputScanned(true);
            setAiResponseText(`[TurtleMask Secure Response]\n\nBased on the sanitized prompt provided, here is your analysis:\n1. The request was successfully tokenized and stripped of raw secrets (sk-proj-*).\n2. PII endpoints (<EMAIL_1>, <PHONE_1>) were safely mapped to session tokens.\n3. The database connection string was successfully blocked.\n\nAll security invariants successfully maintained.`);
          }, 1200);
        }, 1500);
      };

      // PDF Export Handler
      const handleDownloadPDF = () => {
        if (!outputScanned) {
          alert('Output must be scanned and reviewed before exporting.');
          return;
        }
        alert('Generating encrypted PDF report with TurtleMask watermark...');
      };

      // Reset for New Request
      const handleStartNewRequest = () => {
        setRawText('');
        setScanStatus('idle');
        setDetectionResults([]);
        setApprovedSafeVersion(false);
        setResponseStatus('idle');
        setAiResponseText('');
        setOutputScanned(false);
        setUploadedFile(null);
      };

      return (
        <div style={{ minHeight: '100vh', backgroundColor: '#F8FAF9', fontFamily: "'Inter', sans-serif", color: '#1A2420' }}>
          
          {/* HEADER */}
          <header style={{
            backgroundColor: '#0D3424', color: '#FFFFFF', height: '64px', padding: '0 32px',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            position: 'sticky', top: 0, zIndex: 100, borderBottom: '1px solid rgba(255, 255, 255, 0.1)'
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '32px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none" style={{ color: '#F6C445' }}>
                  <path d="M16 3L4 8V15C4 22.38 9.12 28.98 16 30C22.88 28.98 28 22.38 28 15V8L16 3Z" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M16 8L21 12V18L16 22L11 18V12L16 8Z" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                <span style={{ fontWeight: '700', fontSize: '1.1rem', letterSpacing: '-0.02em' }}>TurtleMask</span>
              </div>

              <nav style={{ display: 'flex', gap: '20px' }}>
                <a href="#models" style={{ color: '#A3B8AE', textDecoration: 'none', fontSize: '0.875rem', fontWeight: '500' }}>AI Models</a>
                <a href="#chat" style={{ color: '#FFFFFF', textDecoration: 'none', fontSize: '0.875rem', fontWeight: '600', borderBottom: '2px solid #F6C445', paddingBottom: '18px' }}>Secure Chat</a>
                <a href="#documents" style={{ color: '#A3B8AE', textDecoration: 'none', fontSize: '0.875rem', fontWeight: '500' }}>Documents</a>
                <a href="#activity" style={{ color: '#A3B8AE', textDecoration: 'none', fontSize: '0.875rem', fontWeight: '500' }}>Activity</a>
                <a href="#settings" style={{ color: '#A3B8AE', textDecoration: 'none', fontSize: '0.875rem', fontWeight: '500' }}>Settings</a>
              </nav>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
              <div style={{
                display: 'flex', alignItems: 'center', gap: '6px', backgroundColor: 'rgba(255, 255, 255, 0.08)',
                border: '1px solid rgba(255, 255, 255, 0.15)', padding: '4px 12px', borderRadius: '9999px', fontSize: '0.75rem', color: '#A3B8AE'
              }}>
                <span style={{ width: '6px', height: '6px', borderRadius: '50%', backgroundColor: '#F6C445' }}></span>
                Protected Workspace
              </div>
              <div style={{
                width: '32px', height: '32px', borderRadius: '50%', backgroundColor: '#123D2B',
                border: '1px solid #F6C445', display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: '0.8125rem', fontWeight: '700', color: '#F6C445'
              }}>
                JD
              </div>
            </div>
          </header>

          {/* SELECTED MODEL BAR */}
          <div style={{ backgroundColor: '#123D2B', color: '#FFFFFF', padding: '12px 32px', borderBottom: '1px solid rgba(255,255,255,0.1)' }}>
            <div style={{ maxWidth: '1000px', margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <div style={{ width: '32px', height: '32px', borderRadius: '6px', backgroundColor: selectedModel.logoBg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '700' }}>
                  {selectedModel.name.charAt(0)}
                </div>
                <div>
                  <div style={{ fontSize: '0.875rem', fontWeight: '600' }}>
                    Selected model: {selectedModel.name} ({selectedModel.version}) — {selectedModel.provider}
                  </div>
                  <div style={{ fontSize: '0.75rem', color: '#A3B8AE' }}>
                    Approved for: {selectedModel.approvedDataLevels.join(' and ')} data | Security level: {selectedModel.securityLevel}
                  </div>
                </div>
              </div>
              <button type="button" onClick={() => alert('Redirecting to Model Selection Dashboard...')} style={{
                backgroundColor: 'transparent', border: '1px solid #A3B8AE', color: '#FFFFFF',
                padding: '6px 12px', borderRadius: '6px', fontSize: '0.75rem', fontWeight: '600', cursor: 'pointer'
              }}>
                Change model
              </button>
            </div>
          </div>

          {/* MAIN WORKSPACE */}
          <main style={{ maxWidth: '1000px', margin: '0 auto', padding: '40px 24px 100px 24px' }}>
            
            {/* INTRO */}
            <section style={{ marginBottom: '32px' }}>
              <h1 style={{ fontSize: '2rem', fontWeight: '700', color: '#0D3424', marginBottom: '8px' }}>
                Create a secure AI request
              </h1>
              <p style={{ fontSize: '0.9375rem', color: '#52635B', marginBottom: '8px' }}>
                Add your prompt using text, voice, image, or document. TurtleMask will convert and scan it before sending it to the selected AI model.
              </p>
              <div style={{ fontSize: '0.75rem', color: '#123D2B', fontWeight: '600' }}>
                ℹ️ Your input will be scanned before it reaches this AI model.
              </div>
            </section>

            {/* INPUT TYPE TABS */}
            <div role="tablist" style={{ display: 'flex', gap: '8px', borderBottom: '2px solid #D1D9D5', marginBottom: '24px' }}>
              {['text', 'voice', 'image', 'document'].map((tab) => (
                <button
                  key={tab}
                  role="tab"
                  aria-selected={activeTab === tab}
                  onClick={() => setActiveTab(tab)}
                  style={{
                    padding: '10px 20px',
                    backgroundColor: activeTab === tab ? '#F6C445' : 'transparent',
                    color: activeTab === tab ? '#082217' : '#123D2B',
                    border: 'none',
                    borderTopLeftRadius: '8px',
                    borderTopRightRadius: '8px',
                    fontWeight: '700',
                    fontSize: '0.875rem',
                    cursor: 'pointer',
                    textTransform: 'capitalize'
                  }}
                >
                  {tab}
                </button>
              ))}
            </div>

            {/* TAB CONTENT: TEXT */}
            {activeTab === 'text' && (
              <section style={{ backgroundColor: '#FFFFFF', border: '1px solid #D1D9D5', borderRadius: '12px', padding: '24px', marginBottom: '24px' }}>
                <label htmlFor="prompt-textarea" style={{ display: 'block', fontSize: '0.875rem', fontWeight: '700', marginBottom: '8px', color: '#1A2420' }}>
                  Prompt Input
                </label>
                <textarea
                  id="prompt-textarea"
                  rows={6}
                  value={rawText}
                  onChange={(e) => setRawText(e.target.value)}
                  placeholder="Type your question, task, or request here..."
                  style={{
                    width: '100%', padding: '12px', borderRadius: '8px', border: '1px solid #D1D9D5',
                    fontFamily: 'inherit', fontSize: '0.9375rem', boxSizing: 'border-box', resize: 'vertical'
                  }}
                />
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '12px' }}>
                  <span style={{ fontSize: '0.75rem', color: '#52635B' }}>
                    Characters: {rawText.length} | Avoid sharing passwords, API keys, or confidential secrets.
                  </span>
                  <div style={{ display: 'flex', gap: '10px' }}>
                    <button type="button" onClick={() => setRawText('')} style={{ padding: '8px 16px', borderRadius: '8px', border: '1px solid #D1D9D5', backgroundColor: 'transparent', fontWeight: '600', fontSize: '0.8125rem', cursor: 'pointer' }}>
                      Clear input
                    </button>
                    <button type="button" onClick={handleSecurityScan} style={{ padding: '8px 20px', borderRadius: '8px', border: 'none', backgroundColor: '#F6C445', color: '#082217', fontWeight: '700', fontSize: '0.8125rem', cursor: 'pointer' }}>
                      Scan prompt →
                    </button>
                  </div>
                </div>
              </section>
            )}

            {/* TAB CONTENT: VOICE */}
            {activeTab === 'voice' && (
              <section style={{ backgroundColor: '#FFFFFF', border: '1px solid #D1D9D5', borderRadius: '12px', padding: '32px', textAlign: 'center', marginBottom: '24px' }}>
                <div style={{
                  width: '80px', height: '80px', borderRadius: '50%', backgroundColor: isRecording ? '#FDF2F2' : '#EBF5F0',
                  border: `2px solid ${isRecording ? '#9B1C1C' : '#123D2B'}`, margin: '0 auto 16px auto',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.75rem'
                }}>
                  🎤
                </div>
                <div style={{ fontSize: '1rem', fontWeight: '700', marginBottom: '6px' }}>
                  {isRecording ? 'Listening...' : 'Tap to start recording'}
                </div>
                <div style={{ fontSize: '0.875rem', color: '#52635B', marginBottom: '20px' }}>
                  Recording Timer: 00:{String(recordingTime).padStart(2, '0')}
                </div>
                <div style={{ display: 'flex', justifyContent: 'center', gap: '12px' }}>
                  {!isRecording ? (
                    <button type="button" onClick={handleStartRecording} style={{ padding: '10px 20px', backgroundColor: '#123D2B', color: '#FFFFFF', borderRadius: '8px', border: 'none', fontWeight: '600', cursor: 'pointer' }}>
                      Start recording
                    </button>
                  ) : (
                    <button type="button" onClick={handleStopRecording} style={{ padding: '10px 20px', backgroundColor: '#9B1C1C', color: '#FFFFFF', borderRadius: '8px', border: 'none', fontWeight: '600', cursor: 'pointer' }}>
                      Stop recording
                    </button>
                  )}
                  <button type="button" onClick={handleSpeechToText} style={{ padding: '10px 20px', backgroundColor: '#F6C445', color: '#082217', borderRadius: '8px', border: 'none', fontWeight: '700', cursor: 'pointer' }}>
                    Convert to text
                  </button>
                </div>
              </section>
            )}

            {/* TAB CONTENT: IMAGE */}
            {activeTab === 'image' && (
              <section style={{ backgroundColor: '#FFFFFF', border: '1px solid #D1D9D5', borderRadius: '12px', padding: '32px', textAlign: 'center', marginBottom: '24px' }}>
                <div style={{ border: '2px dashed #D1D9D5', borderRadius: '12px', padding: '32px', marginBottom: '16px' }}>
                  <p style={{ fontWeight: '600', marginBottom: '4px' }}>Drag & drop or upload image (PNG, JPG, WEBP, max 10MB)</p>
                  <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'image')} style={{ display: 'none' }} id="image-upload" />
                  <label htmlFor="image-upload" style={{ display: 'inline-block', padding: '8px 16px', backgroundColor: '#123D2B', color: '#FFFFFF', borderRadius: '8px', cursor: 'pointer', fontWeight: '600', fontSize: '0.875rem' }}>
                    Upload image
                  </label>
                </div>
                {uploadedFile && <div style={{ fontSize: '0.875rem', fontWeight: '600', marginBottom: '12px' }}>Selected: {uploadedFile.name}</div>}
                <button type="button" disabled={!uploadedFile || isExtracting} onClick={handleExtractText} style={{ padding: '10px 24px', backgroundColor: '#F6C445', color: '#082217', borderRadius: '8px', border: 'none', fontWeight: '700', cursor: 'pointer' }}>
                  {isExtracting ? 'Extracting OCR Text...' : 'Extract text using OCR'}
                </button>
              </section>
            )}

            {/* TAB CONTENT: DOCUMENT */}
            {activeTab === 'document' && (
              <section style={{ backgroundColor: '#FFFFFF', border: '1px solid #D1D9D5', borderRadius: '12px', padding: '32px', textAlign: 'center', marginBottom: '24px' }}>
                <div style={{ border: '2px dashed #D1D9D5', borderRadius: '12px', padding: '32px', marginBottom: '16px' }}>
                  <p style={{ fontWeight: '600', marginBottom: '4px' }}>Drag & drop document (PDF, DOCX, TXT, CSV, max 20MB)</p>
                  <input type="file" accept=".pdf,.docx,.txt,.csv" onChange={(e) => handleFileUpload(e, 'document')} style={{ display: 'none' }} id="doc-upload" />
                  <label htmlFor="doc-upload" style={{ display: 'inline-block', padding: '8px 16px', backgroundColor: '#123D2B', color: '#FFFFFF', borderRadius: '8px', cursor: 'pointer', fontWeight: '600', fontSize: '0.875rem' }}>
                    Upload document
                  </label>
                </div>
                {uploadedFile && <div style={{ fontSize: '0.875rem', fontWeight: '600', marginBottom: '12px' }}>Selected: {uploadedFile.name}</div>}
                <button type="button" disabled={!uploadedFile || isExtracting} onClick={handleExtractText} style={{ padding: '10px 24px', backgroundColor: '#F6C445', color: '#082217', borderRadius: '8px', border: 'none', fontWeight: '700', cursor: 'pointer' }}>
                  {isExtracting ? 'Extracting Document Text...' : 'Extract text & scan'}
                </button>
              </section>
            )}

            {/* SECURITY SCANNING PANEL */}
            {scanStatus === 'scanning' && (
              <section style={{ backgroundColor: '#FFF8E6', border: '1px solid #F6C445', borderRadius: '12px', padding: '24px', marginBottom: '24px' }}>
                <h3 style={{ fontSize: '1rem', fontWeight: '700', color: '#0D3424', marginBottom: '12px' }}>Security scan in progress...</h3>
                <ul style={{ margin: 0, paddingLeft: '20px', fontSize: '0.875rem', color: '#52635B', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                  {scanLogs.map((log, idx) => <li key={idx}>{log}</li>)}
                </ul>
              </section>
            )}

            {scanStatus === 'completed' && (
              <section style={{ backgroundColor: '#FFFFFF', border: '1px solid #D1D9D5', borderRadius: '12px', padding: '24px', marginBottom: '24px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.125rem', fontWeight: '700', color: '#0D3424', margin: 0 }}>Security scan results</h3>
                  <span style={{ backgroundColor: '#FDF2F2', color: '#9B1C1C', border: '1px solid #F8B4B4', padding: '4px 12px', borderRadius: '9999px', fontSize: '0.75rem', fontWeight: '700' }}>
                    Overall Risk: High (Credentials Blocked)
                  </span>
                </div>

                {/* DETECTION RESULTS LIST */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginBottom: '24px' }}>
                  {detectionResults.map((det) => (
                    <div key={det.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px', backgroundColor: '#F8FAF9', borderRadius: '8px', border: '1px solid #E1E8E4' }}>
                      <div>
                        <div style={{ fontSize: '0.875rem', fontWeight: '700', color: '#1A2420' }}>
                          {det.type} detected — <span style={{ color: det.isSecret ? '#9B1C1C' : '#123D2B' }}>{det.action}</span>
                        </div>
                        <div style={{ fontSize: '0.75rem', color: '#52635B' }}>Reason: {det.reason} (Confidence: {det.confidence})</div>
                      </div>
                      <div style={{ fontSize: '0.8125rem', fontWeight: '600', backgroundColor: '#FFFFFF', padding: '4px 8px', borderRadius: '6px', border: '1px solid #D1D9D5' }}>
                        {det.maskedValue}
                      </div>
                    </div>
                  ))}
                </div>

                {/* REDACTION PREVIEW PANELS */}
                <h4 style={{ fontSize: '0.9375rem', fontWeight: '700', marginBottom: '12px' }}>Redaction & Sanitization Preview</h4>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '20px' }}>
                  <div style={{ backgroundColor: '#FDF2F2', border: '1px solid #F8B4B4', borderRadius: '8px', padding: '16px' }}>
                    <div style={{ fontSize: '0.75rem', fontWeight: '700', color: '#9B1C1C', marginBottom: '8px' }}>ORIGINAL INPUT (MASKED)</div>
                    <p style={{ fontSize: '0.8125rem', color: '#1A2420', margin: 0, whiteSpace: 'pre-wrap' }}>
                      Hello team, please review API key <span style={{ backgroundColor: '#F8B4B4', padding: '2px 4px' }}>sk-proj-••••••••</span> and contact <span style={{ backgroundColor: '#FEE2E2', padding: '2px 4px' }}>support@company.com</span>...
                    </p>
                  </div>

                  <div style={{ backgroundColor: '#EBF5F0', border: '1px solid #C2DCCE', borderRadius: '8px', padding: '16px' }}>
                    <div style={{ fontSize: '0.75rem', fontWeight: '700', color: '#123D2B', marginBottom: '8px' }}>SAFE VERSION SENT TO AI</div>
                    <p style={{ fontSize: '0.8125rem', color: '#1A2420', margin: 0, whiteSpace: 'pre-wrap' }}>
                      Hello team, please review API key <span style={{ backgroundColor: '#F8B4B4', fontWeight: '700', color: '#9B1C1C' }}>[BLOCKED_SECRET]</span> and contact <span style={{ backgroundColor: '#FEF3C7', fontWeight: '700' }}>&lt;EMAIL_1&gt;</span>...
                    </p>
                  </div>
                </div>

                <div style={{ fontSize: '0.75rem', color: '#9B1C1C', fontWeight: '600', marginBottom: '20px' }}>
                  ⚠️ Blocked secrets will not be sent to the AI model and cannot be restored.
                </div>

                {/* USER APPROVAL CHECKBOX */}
                <label style={{ display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer', fontSize: '0.875rem', fontWeight: '600' }}>
                  <input
                    type="checkbox"
                    checked={approvedSafeVersion}
                    onChange={(e) => setApprovedSafeVersion(e.target.checked)}
                    style={{ width: '18px', height: '18px', accentColor: '#123D2B' }}
                  />
                  I reviewed the redaction preview and approve sending the safe version.
                </label>
              </section>
            )}

            {/* FINAL ACTION PANEL */}
            <section style={{ backgroundColor: '#0D3424', color: '#FFFFFF', borderRadius: '12px', padding: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '16px', marginBottom: '40px' }}>
              <div>
                <div style={{ fontSize: '0.875rem', fontWeight: '700' }}>Selected Model: {selectedModel.name}</div>
                <div style={{ fontSize: '0.75rem', color: '#A3B8AE' }}>Data Sensitivity: {dataSensitivity} | Scan Status: {scanStatus.toUpperCase()}</div>
              </div>
              <div style={{ display: 'flex', gap: '12px' }}>
                <button type="button" onClick={handleStartNewRequest} style={{ padding: '10px 16px', backgroundColor: 'transparent', border: '1px solid #A3B8AE', color: '#FFFFFF', borderRadius: '8px', fontWeight: '600', fontSize: '0.875rem', cursor: 'pointer' }}>
                  Cancel request
                </button>
                <button
                  type="button"
                  disabled={!isReadyToSend}
                  onClick={handleSendSecureRequest}
                  style={{
                    padding: '10px 24px',
                    backgroundColor: isReadyToSend ? '#F6C445' : '#52635B',
                    color: isReadyToSend ? '#082217' : '#9CA3AF',
                    border: 'none',
                    borderRadius: '8px',
                    fontWeight: '700',
                    fontSize: '0.875rem',
                    cursor: isReadyToSend ? 'pointer' : 'not-allowed'
                  }}
                >
                  Send secure request →
                </button>
              </div>
            </section>

            {/* AI RESPONSE SECTION */}
            {responseStatus !== 'idle' && (
              <section style={{ backgroundColor: '#FFFFFF', border: '1px solid #D1D9D5', borderRadius: '12px', padding: '24px', marginBottom: '40px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.125rem', fontWeight: '700', color: '#0D3424', margin: 0 }}>Secure AI response</h3>
                  {outputScanned && (
                    <span style={{ backgroundColor: '#EBF5F0', color: '#123D2B', border: '1px solid #C2DCCE', padding: '4px 12px', borderRadius: '9999px', fontSize: '0.75rem', fontWeight: '700' }}>
                      Output scanned ✓
                    </span>
                  )}
                </div>

                {responseStatus !== 'ready' ? (
                  <div style={{ padding: '32px', textAlign: 'center', color: '#52635B', fontSize: '0.9375rem' }}>
                    {responseStatus === 'sending' && 'Sending sanitized request to Gemini 1.5 Pro...'}
                    {responseStatus === 'scanning_output' && 'Scanning response for sensitive information and token leaks...'}
                  </div>
                ) : (
                  <div>
                    <div style={{ backgroundColor: '#F8FAF9', border: '1px solid #D1D9D5', borderRadius: '8px', padding: '16px', whiteSpace: 'pre-wrap', fontSize: '0.9375rem', lineHeight: '1.6', marginBottom: '20px' }}>
                      {aiResponseText}
                    </div>

                    <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                      <button type="button" onClick={() => alert('Response copied to clipboard.')} style={{ padding: '8px 16px', backgroundColor: '#123D2B', color: '#FFFFFF', border: 'none', borderRadius: '8px', fontWeight: '600', fontSize: '0.8125rem', cursor: 'pointer' }}>
                        Copy response
                      </button>
                      <button type="button" onClick={handleDownloadPDF} style={{ padding: '8px 16px', backgroundColor: '#F6C445', color: '#082217', border: 'none', borderRadius: '8px', fontWeight: '700', fontSize: '0.8125rem', cursor: 'pointer' }}>
                        Download as PDF
                      </button>
                      <button type="button" onClick={handleStartNewRequest} style={{ padding: '8px 16px', backgroundColor: 'transparent', border: '1px solid #123D2B', color: '#123D2B', border: '1px solid #123D2B', borderRadius: '8px', fontWeight: '600', fontSize: '0.8125rem', cursor: 'pointer' }}>
                        Start new secure request
                      </button>
                    </div>
                  </div>
                )}
              </section>
            )}

          </main>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SecureInputWorkspace />);
  </script>

</body>
</html>
